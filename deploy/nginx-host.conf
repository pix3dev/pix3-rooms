# Host nginx for the systemd deployment (the compose stack uses deploy/nginx.conf instead).
# Install as /etc/nginx/sites-available/rooms.pix3.dev and symlink into sites-enabled/.
# Replace DOMAIN_PLACEHOLDER first:
#   sudo sed -i "s/DOMAIN_PLACEHOLDER/rooms.pix3.dev/g" /etc/nginx/sites-available/rooms.pix3.dev
#
# Every http-level name here is prefixed `rooms_`. If this host also serves cloud.pix3.dev, an
# unprefixed `map $http_upgrade $connection_upgrade` or a `zone=ws_conn` already exists in the
# same http context and nginx refuses to start on the duplicate.

map $http_upgrade $rooms_connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone  $binary_remote_addr zone=rooms_admin_rl:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=rooms_ws_conn:10m;

upstream rooms_backend {
    server 127.0.0.1:5011;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The server enforces its own 16 KiB frame cap; this is a coarse outer bound.
    client_max_body_size 1m;

    # Game socket. WebSocket upgrade, no buffering, generous read timeout for idle-but-open rooms
    # (the server has its own ping/pong idle timeout, which is the real one).
    location /ws {
        limit_conn rooms_ws_conn 16;

        proxy_pass         http://rooms_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $rooms_connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Rooms__Server__TrustForwardedHeaders reads the LAST hop of this header, so nginx must be
        # the one appending it — and nothing but nginx may reach 127.0.0.1:5011.
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        tcp_nodelay        on;
    }

    # Room lifecycle API - service-token authenticated at the app, rate-limited here.
    location /admin/ {
        limit_req zone=rooms_admin_rl burst=20 nodelay;

        proxy_pass       http://rooms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass       http://rooms_backend/health;
        access_log       off;
    }

    # Metrics stay private: scrape from the host itself, not the public interface.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        proxy_pass http://rooms_backend/metrics;
    }

    location / { return 404; }
}
