# Reverse proxy for the Room Fabric. Replace DOMAIN_PLACEHOLDER before use
# (e.g. sed -i "s/DOMAIN_PLACEHOLDER/rooms.pix3.dev/g" nginx.conf).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Game sockets are long-lived and chatty; keep the admin surface separately rate-limited.
limit_req_zone  $binary_remote_addr zone=admin_rl:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The server enforces its own 16 KiB frame cap; this is a coarse outer bound.
    client_max_body_size 1m;

    # Game socket. WebSocket upgrade, no buffering, generous read timeout for idle-but-open rooms
    # (the server has its own ping/pong idle timeout, which is the real one).
    location /ws {
        limit_conn ws_conn 16;

        proxy_pass         http://rooms:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        tcp_nodelay        on;
    }

    # Room lifecycle API — service-token authenticated at the app, rate-limited here.
    location /admin/ {
        limit_req zone=admin_rl burst=20 nodelay;

        proxy_pass       http://rooms:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass       http://rooms:8080/health;
        access_log       off;
    }

    # Metrics stay private: scrape over the internal network, not the public interface.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://rooms:8080/metrics;
    }

    location / { return 404; }
}
