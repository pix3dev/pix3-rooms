# Single-host deployment of the Room Fabric behind nginx (TLS terminates at nginx).
# Usage from the repository root:  docker compose -f deploy/docker-compose.yml up -d --build

services:
  rooms:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: pix3-rooms:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Identity is shared with pix3-collab-server: same HS256 secret, scoped audience.
      Rooms__Auth__Mode: Jwt
      Rooms__Auth__JwtSecret: ${ROOMS_JWT_SECRET:?set ROOMS_JWT_SECRET}
      Rooms__Auth__Issuer: ${ROOMS_JWT_ISSUER:-pix3-cloud}
      Rooms__Auth__Audience: ${ROOMS_JWT_AUDIENCE:-pix3-rooms}
      Rooms__Auth__ServiceToken: ${ROOMS_SERVICE_TOKEN:?set ROOMS_SERVICE_TOKEN}
      Rooms__Server__MaxRooms: ${ROOMS_MAX_ROOMS:-64}
    expose:
      - "8080"
    # A 600-player room is ~1 core; leave headroom for the socket threads and GC.
    deploy:
      resources:
        limits:
          cpus: "${ROOMS_CPUS:-4}"
          memory: ${ROOMS_MEMORY:-2g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - rooms
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'

volumes:
  certbot-conf:
  certbot-www:
