name: Deploy Rooms Server

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'Pix3.Rooms.slnx'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy mid-flight: the window between `ln -sfn current` and `systemctl restart`
# is exactly where a cancellation would leave the host inconsistent.
concurrency:
  group: deploy-rooms-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish and deploy to rooms.pix3.dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      DEPLOY_HOST: rooms.pix3.dev
      DEPLOY_PORT: ${{ secrets.ROOMS_DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.ROOMS_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.ROOMS_DEPLOY_PATH }}
      # Loopback address the unit binds to, polled after the restart.
      HEALTH_URL: http://127.0.0.1:5011/health

    steps:
      # First, so a missing credential costs seconds instead of a full build+publish before ssh
      # fails with something opaque. Read through env, never interpolated into the script body.
      - name: Verify deploy credentials
        env:
          KEY: ${{ secrets.ROOMS_DEPLOY_SSH_KEY }}
        run: |
          case "$KEY" in
            ''|PLACEHOLDER*)
              echo "::error::ROOMS_DEPLOY_SSH_KEY is unset or still the placeholder. Set it from /root/rooms-deploy-key on rooms.pix3.dev."
              exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Deliberately re-run the gate here rather than trusting the CI workflow's verdict on the
      # same sha: this job is what reaches production, so it verifies its own input.
      - run: dotnet restore Pix3.Rooms.slnx
      - run: dotnet build Pix3.Rooms.slnx --no-restore -c Release -warnaserror
      - run: dotnet test Pix3.Rooms.slnx --no-build -c Release

      # Self-contained: the host needs no .NET installed, and a runtime upgrade is a deploy, not
      # an apt operation. NOT ReadyToRun - docs/architecture.md rejects it (a long-lived server
      # wants tiered JIT + dynamic PGO in the steady state; startup time is irrelevant here).
      - name: Publish self-contained
        run: |
          set -euo pipefail
          dotnet publish src/Pix3.Rooms.Server/Pix3.Rooms.Server.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o .deploy/app
          tar -C .deploy/app -czf .deploy/pix3-rooms.tar.gz .

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.ROOMS_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload release bundle
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_PORT:-22}" .deploy/pix3-rooms.tar.gz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/pix3-rooms-${GITHUB_SHA}.tar.gz"

      - name: Activate release
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_ROOT='${DEPLOY_PATH}' RELEASE_SHA='${GITHUB_SHA}' HEALTH_URL='${HEALTH_URL}' bash -s" <<'EOF'
          set -euo pipefail

          RELEASE_DIR="${DEPLOY_ROOT}/releases/${RELEASE_SHA}"
          ARCHIVE="/tmp/pix3-rooms-${RELEASE_SHA}.tar.gz"

          if [ ! -f "${DEPLOY_ROOT}/shared/rooms.env" ]; then
            # DEPLOY_ROOT is the ROOMS_DEPLOY_PATH secret, so GitHub masks it out of this
            # message: say where to look rather than printing a path that renders as ***.
            echo "No shared/rooms.env under the deploy root." >&2
            echo "Either the file is missing on the host, or the ROOMS_DEPLOY_PATH secret is wrong." >&2
            echo "Deploy root resolves to a directory that is $([ -d "${DEPLOY_ROOT}" ] && echo present || echo ABSENT)." >&2
            exit 1
          fi

          mkdir -p "${DEPLOY_ROOT}/releases"
          rm -rf "${RELEASE_DIR}"
          mkdir -p "${RELEASE_DIR}"
          tar -xzf "${ARCHIVE}" -C "${RELEASE_DIR}"
          rm -f "${ARCHIVE}"
          chmod +x "${RELEASE_DIR}/Pix3.Rooms.Server"
          # The service runs as pix3rooms, not as the deploy user.
          chmod -R a+rX "${RELEASE_DIR}"

          PREVIOUS="$(readlink -f "${DEPLOY_ROOT}/current" 2>/dev/null || true)"
          ln -sfn "${RELEASE_DIR}" "${DEPLOY_ROOT}/current"
          sudo systemctl restart pix3-rooms

          # A room server that starts and then fails its own config validation exits within a
          # second, so poll /health rather than trusting the restart's exit code.
          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 "${HEALTH_URL}" >/dev/null 2>&1; then healthy=1; break; fi
            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            echo "::error::${RELEASE_SHA} failed its health check - rolling back" >&2
            journalctl -u pix3-rooms -n 60 --no-pager || true
            if [ -n "${PREVIOUS}" ] && [ -d "${PREVIOUS}" ]; then
              ln -sfn "${PREVIOUS}" "${DEPLOY_ROOT}/current"
              sudo systemctl restart pix3-rooms
              echo "Rolled back to $(basename "${PREVIOUS}")" >&2
            fi
            exit 1
          fi

          # Keep the last five releases so a manual rollback is a symlink flip.
          ls -1dt "${DEPLOY_ROOT}"/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf

          systemctl --no-pager --full status pix3-rooms | head -n 20
          EOF
